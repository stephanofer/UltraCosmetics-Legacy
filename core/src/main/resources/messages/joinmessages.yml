Clear:
  Join-Messages: <bold><red>Clear current join message
Menu:
  Join-Messages:
    Title: <bold>Join Messages
    Button:
      Name: <bold><yellow>Join Messages
      Lore: |-
        <gray>Announce your arrival in style.

        <gray>Unlocked: </gray><white><unlocked>
      Tooltip-Equip: <bold><aqua>Equip
      Tooltip-Unequip: <bold><red>Unequip
Treasure-Chests-Loot:
  Join-Messages: |-
    <yellow>Join Message
    <cosmetic>
Treasure-Chests-Loot-Messages:
  Join-Messages: <prefix> <bold><gold><name> found rare <cosmetic>
Join-Messages:
  Equip: <prefix> <green>You equipped <join-message-name>.
  Unequip: <prefix> <gray>You unequipped <join-message-name>.
  Preview-Label: '<yellow>Preview:'
  Controls: <gray>Left click to equip or unequip.
  Preview-Control: <aqua>Right click for a private preview.
  Preview-Cooldown: <prefix> <yellow>Please wait before previewing again.
  Preview-Unavailable: <prefix> <yellow>This Join Message cannot be previewed right now.
  Server:
    name: <bold><yellow>Server
    Description: <gray>Announces your arrival to the server.
    Message:
      - '{BLANK}'
      - '{CTR}<dark_gray>[<green>+<dark_gray>] <yellow><bold><player><reset> <gold>joined the server!'
      - '{BLANK}'
  Royal:
    name: <bold><gold>Royal
    Description: <gray>Enter with the welcome of a royal realm.
    Message:
      - '{BLANK}'
      - '{CTR}<gold>The realm welcomes <yellow><bold><player><reset><gold>!'
      - '{BLANK}'
  Ender:
    name: <bold><dark_purple>Ender
    Description: <gray>Emerge from the void before the server.
    Message:
      - '{BLANK}'
      - '{CTR}<dark_purple><bold><player><reset> <light_purple>emerged from the void...'
      - '{BLANK}'
  Lightning:
    name: <bold><yellow>Lightning
